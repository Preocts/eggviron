name: "python tests and coverage"
# Uses:
# https://github.com/actions/checkout : v7.0.1 de0fac2e4500dabe0009e67214ff5f5447ce83dd
# https://github.com/actions/download-artifact : v8.0.2 9000827ccba6bdab643e8b6fd33ac0654aef8333
# https://github.com/actions/upload-artifact : v7.0.2 cf430e030ddbb5b0abf93d22962f4752f3646cd9
# https://github.com/astral-sh/setup-uv : v10.3.2 07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

on:
  pull_request:
  push:
    branches:
      - "main"
  schedule:
    - cron: "27 0 * * 1"

jobs:
  run-tests-and-coverage:
    name: "Run nox for tests and coverage"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
          # - "macos-latest"
          - "windows-latest"
          - "ubuntu-latest"
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: "Repo checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"

      - name: "Install the latest version of uv"
        uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e"
        with:
          version: "latest"
          python-version: "${{ matrix.python-version }}"
          enable-cache: true

      - name: "Run tests and coverage via nox"
        run: "uvx nox --session test -- partial-coverage"

      - name: "Save coverage artifact"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "coverage-artifact-${{ matrix.os}}-${{ matrix.python-version}}"
          path: ".coverage.*"
          retention-days: 1
          include-hidden-files: true

  coverage-compile:
    name: "coverage compile"
    needs: "run-tests-and-coverage"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Repo checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"

      - name: "Install the latest version of uv"
        uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e"
        with:
          version: "latest"
          enable-cache: true

      - name: "Download coverage artifacts"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        with:
          pattern: "coverage-artifact-*"
          merge-multiple: true

      - name: "Compile coverage data"
        run: "uvx nox --session combine"

      - name: "Post summary to step summary"
        run: |
          export TOTAL=$(python -c "import json;print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          echo "### Total coverage: ${TOTAL}%" >> $GITHUB_STEP_SUMMARY

  linters-and-formatters:
    name: "linters and formatters"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Repo checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"

      - name: "Install the latest version of uv"
        uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e"
        with:
          version: "latest"
          enable-cache: true

      - name: "Run linters and formatters"
        run: "uvx nox --session format lint"

      - name: "Check for any unstaged changes"
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "#### Format or Lint changes found. Please run 'uvx nox' locally and push the changes." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
